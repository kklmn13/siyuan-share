# 文件路径: .github/workflows/manual_build_backend.yml
name: Backend Docker Image Build (手动 - 推送至 Docker Hub)

# 配置手动触发
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker 镜像标签 (例如: latest 或 v1.0.0)'
        required: true
        default: 'latest'

env:
  # 目标注册表设置为 Docker Hub
  REGISTRY: docker.io
  # 从 Secrets 中获取 Docker Hub 用户名
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  # 镜像名称格式改为 DOCKER_USER/repo_name
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/siyuan-share-backend 

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 推送 Docker Hub 无需 packages: write 权限

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # 使用 Docker Hub Token 进行认证
          password: ${{ secrets.DOCKERHUB_TOKEN }} 

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./backend/Dockerfile 
          push: true
          # 完整的镜像标签格式: DOCKER_USER/siyuan-share-backend:tag
          tags: ${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag }}
          
      - name: 打印镜像详情
        run: |
          echo "✅ 成功推送镜像到 Docker Hub:"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag }}"
